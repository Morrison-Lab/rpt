# THROWAWAY: temporary caller to verify Morrison-Lab/gha#400 (duplicate-review
# fix) in agent mode against gha@test-live-fix before sliding @v2. Delete after
# testing. On main only so claude-code-action's default-branch workflow
# validation passes; dispatch-only, so it never runs on normal PR activity.
name: GHA Review Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@test-live-fix
    secrets: inherit
    with:
      pr-number: ${{ inputs.pr_number }}
      allowed-bots: "github-actions[bot],claude"
